<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="Anatomie d'une boîte à moustaches : la boîte couvre la moitié centrale des commandes, de Q1 à 50 euros jusqu'à Q3 à 1790 euros, le trait de la médiane à 177 euros est nettement décalé vers la gauche, chaque moustache couvre 25 pour cent des commandes, et 14 valeurs atypiques se détachent au-delà de 4400 euros dont la flotte à 379050 euros.">
  <rect x="0" y="0" width="780" height="300" rx="10" fill="#ffffff"/>

  <!-- accolades du haut : ce que couvre chaque zone -->
  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <path d="M90 80 L90 72 L220 72 L220 80"/>
    <path d="M220 80 L220 68 L470 68 L470 80"/>
    <path d="M470 80 L470 72 L560 72 L560 80"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#475569" text-anchor="middle">
    <text x="155" y="62" font-size="12">25 %</text>
    <text x="345" y="58" font-size="13" font-weight="600" fill="#0f172a">la moitié centrale des commandes</text>
    <text x="515" y="62" font-size="12">25 %</text>
  </g>

  <!-- moustaches -->
  <g stroke="#0f172a" stroke-width="2" stroke-linecap="round">
    <line x1="90" y1="130" x2="220" y2="130"/>
    <line x1="90" y1="112" x2="90" y2="148"/>
    <line x1="470" y1="130" x2="560" y2="130"/>
    <line x1="560" y1="112" x2="560" y2="148"/>
  </g>

  <!-- boite -->
  <rect x="220" y="98" width="250" height="64" fill="#e0f2fe" stroke="#0f172a" stroke-width="2"/>
  <!-- mediane : le trait qui porte tout le cours -->
  <line x1="282" y1="98" x2="282" y2="162" stroke="#0369a1" stroke-width="4" stroke-linecap="round"/>

  <!-- valeurs atypiques -->
  <g fill="#ffffff" stroke="#b45309" stroke-width="2">
    <circle cx="596" cy="130" r="4.5"/>
    <circle cx="620" cy="130" r="4.5"/>
    <circle cx="642" cy="130" r="4.5"/>
    <circle cx="664" cy="130" r="4.5"/>
  </g>
  <circle cx="714" cy="130" r="6.5" fill="#b45309" stroke="#b45309" stroke-width="2"/>

  <!-- annotation des atypiques -->
  <path d="M640 108 L630 121" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <path d="M714 141 L714 158" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#b45309" text-anchor="middle">
    <text x="652" y="100" font-size="12" font-weight="600">14 valeurs atypiques</text>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#b45309" text-anchor="middle">
    <text x="714" y="174" font-size="11">la flotte à 379 050 €</text>
  </g>

  <!-- reperes : traits de rappel -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="220" y1="166" x2="220" y2="184"/>
    <line x1="470" y1="166" x2="470" y2="184"/>
    <line x1="90"  y1="152" x2="90"  y2="222"/>
    <line x1="282" y1="166" x2="282" y2="222"/>
    <line x1="560" y1="152" x2="560" y2="222"/>
  </g>

  <!-- etiquettes, deux rangees pour eviter les chevauchements -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <text x="220" y="198" font-size="13" font-weight="600" fill="#0f172a">Q1</text>
    <text x="220" y="213" font-size="12" fill="#475569">50 €</text>
    <text x="470" y="198" font-size="13" font-weight="600" fill="#0f172a">Q3</text>
    <text x="470" y="213" font-size="12" fill="#475569">1 790 €</text>

    <text x="90"  y="236" font-size="13" font-weight="600" fill="#0f172a">minimum</text>
    <text x="90"  y="251" font-size="12" fill="#475569">15 €</text>
    <text x="282" y="236" font-size="13" font-weight="700" fill="#0369a1">médiane</text>
    <text x="282" y="251" font-size="12" fill="#0369a1">177 €</text>
    <text x="560" y="236" font-size="13" font-weight="600" fill="#0f172a">seuil haut</text>
    <text x="560" y="251" font-size="12" fill="#475569">4 400 €</text>
  </g>

  <!-- la lecture a retenir -->
  <text x="282" y="283" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#0369a1" text-anchor="middle" font-style="italic">la médiane est collée à gauche : distribution étalée vers la droite</text>
</svg>
