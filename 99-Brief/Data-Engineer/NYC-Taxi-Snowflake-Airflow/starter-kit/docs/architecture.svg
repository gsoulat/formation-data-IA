<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 960" width="1560" height="960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
  </marker>
  <filter id="ombre" x="-5%" y="-10%" width="110%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1560" height="960" fill="#FFFFFF"/>
<text x="780.0" y="44" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">Pipeline NYC Yellow Taxi : ce que vous allez construire</text>
<rect x="40" y="70" width="1480" height="140" rx="18" fill="#FFFBEB" stroke="#E5C97B" stroke-width="1.5"/>
<text x="64" y="100" font-size="17" font-weight="700" fill="#92600A">1. Sources publiques (NYC TLC)</text>
<rect x="40" y="250" width="1480" height="180" rx="18" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.5"/>
<text x="64" y="280" font-size="17" font-weight="700" fill="#1F6FB2">2. Airflow : le chef d'orchestre</text>
<text x="1496" y="280" font-size="13" fill="#1F6FB2" text-anchor="end">une exécution traite un mois de données</text>
<rect x="40" y="480" width="1480" height="235" rx="18" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.5"/>
<text x="64" y="510" font-size="17" font-weight="700" fill="#127CA6">3. Snowflake : l'entrepôt</text>
<rect x="40" y="765" width="1480" height="150" rx="18" fill="#F0FAF2" stroke="#9AD3A8" stroke-width="1.5"/>
<text x="64" y="795" font-size="17" font-weight="700" fill="#1E7A3A">4. Consommation</text>
<rect x="315" y="116" width="210" height="80" rx="12" fill="#FFFFFF" stroke="#E5C97B" stroke-width="1.3" filter="url(#ombre)"/>
<text x="333" y="146" font-size="15" font-weight="700" fill="#1F2933">Trajets</text>
<text x="333" y="170" font-size="12.5" fill="#4B5563">1 fichier Parquet par mois</text>
<text x="333" y="188" font-size="12.5" fill="#4B5563">≈ 3,5 M de lignes, 60 Mo</text>
<rect x="795" y="116" width="450" height="80" rx="12" fill="#FFFFFF" stroke="#E5C97B" stroke-width="1.3" filter="url(#ombre)"/>
<text x="813" y="146" font-size="15" font-weight="700" fill="#1F2933">Zones</text>
<text x="813" y="170" font-size="12.5" fill="#4B5563">1 fichier CSV de 265 lignes, chargé une seule fois</text>
<text x="813" y="188" font-size="12.5" fill="#4B5563">par votre script Python (hors Airflow)</text>
<rect x="75" y="300" width="210" height="108" rx="12" fill="#FFFFFF" stroke="#8DB8E0" stroke-width="1.3" filter="url(#ombre)"/>
<circle cx="101" cy="325" r="12" fill="#1F6FB2"/>
<text x="101" y="330" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="121" y="330" font-size="15" font-weight="700" fill="#1F2933">Vérifier</text>
<text x="93" y="354" font-size="12.5" fill="#4B5563">que le fichier du mois</text>
<text x="93" y="372" font-size="12.5" fill="#4B5563">est publié</text>
<rect x="315" y="300" width="210" height="108" rx="12" fill="#FFFFFF" stroke="#8DB8E0" stroke-width="1.3" filter="url(#ombre)"/>
<circle cx="341" cy="325" r="12" fill="#1F6FB2"/>
<text x="341" y="330" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="361" y="330" font-size="15" font-weight="700" fill="#1F2933">Télécharger</text>
<text x="333" y="354" font-size="12.5" fill="#4B5563">le fichier, puis l'envoyer</text>
<text x="333" y="372" font-size="12.5" fill="#4B5563">sur le stage</text>
<rect x="555" y="300" width="210" height="108" rx="12" fill="#FFFFFF" stroke="#8DB8E0" stroke-width="1.3" filter="url(#ombre)"/>
<circle cx="581" cy="325" r="12" fill="#1F6FB2"/>
<text x="581" y="330" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="601" y="330" font-size="15" font-weight="700" fill="#1F2933">Copier</text>
<text x="573" y="354" font-size="12.5" fill="#4B5563">le fichier dans la table</text>
<text x="573" y="372" font-size="12.5" fill="#4B5563">RAW, sans doublon</text>
<rect x="795" y="300" width="690" height="108" rx="12" fill="#FFFFFF" stroke="#8DB8E0" stroke-width="1.3" filter="url(#ombre)"/>
<circle cx="821" cy="325" r="12" fill="#1F6FB2"/>
<text x="821" y="330" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="841" y="330" font-size="15" font-weight="700" fill="#1F2933">Transformer et contrôler</text>
<text x="813" y="354" font-size="12.5" fill="#4B5563">Exécuter les fichiers SQL fournis, dans le bon ordre, pour le mois traité.</text>
<text x="813" y="372" font-size="12.5" fill="#4B5563">Un contrôle qui échoue arrête la suite : une donnée fausse ne se propage pas.</text>
<line x1="288" y1="354.0" x2="311" y2="354.0" stroke="#6B7280" stroke-width="1.8" marker-end="url(#fleche)"/>
<line x1="528" y1="354.0" x2="551" y2="354.0" stroke="#6B7280" stroke-width="1.8" marker-end="url(#fleche)"/>
<line x1="768" y1="354.0" x2="791" y2="354.0" stroke="#6B7280" stroke-width="1.8" marker-end="url(#fleche)"/>
<rect x="75" y="542" width="210" height="142" rx="12" fill="#FFFFFF" stroke="#7FD0EE" stroke-width="1.3" stroke-dasharray="6 5" filter="url(#ombre)"/>
<text x="93" y="572" font-size="15" font-weight="700" fill="#127CA6">À créer aussi</text>
<text x="93" y="596" font-size="12.5" fill="#4B5563">1 base et 4 schémas</text>
<text x="93" y="614" font-size="12.5" fill="#4B5563">1 warehouse de taille XS</text>
<text x="93" y="632" font-size="12.5" fill="#4B5563">1 rôle pour les outils</text>
<text x="93" y="650" font-size="12.5" fill="#4B5563">1 utilisateur de service</text>
<text x="93" y="668" font-size="12.5" fill="#4B5563">authentifié par clé</text>
<rect x="315" y="542" width="210" height="142" rx="12" fill="#FFFFFF" stroke="#7FD0EE" stroke-width="1.3" filter="url(#ombre)"/>
<text x="333" y="572" font-size="15" font-weight="700" fill="#1F2933">Stage</text>
<text x="333" y="596" font-size="12.5" fill="#4B5563">Zone de dépôt des</text>
<text x="333" y="614" font-size="12.5" fill="#4B5563">fichiers, avant leur</text>
<text x="333" y="632" font-size="12.5" fill="#4B5563">copie dans une table</text>
<rect x="555" y="542" width="210" height="142" rx="12" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.3" filter="url(#ombre)"/>
<path d="M567,542 h186 a12,12 0 0 1 12,12 v0 h-210 v0 a12,12 0 0 1 12,-12 z" fill="#B87333"/>
<rect x="555" y="552" width="210" height="4" fill="#B87333"/>
<text x="573" y="580" font-size="15" font-weight="700" fill="#1F2933">RAW</text>
<rect x="685" y="565" width="68" height="20" rx="10" fill="#B87333"/>
<text x="719.0" y="579" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">bronze</text>
<text x="573" y="604" font-size="12.5" fill="#4B5563">Copie fidèle des fichiers</text>
<text x="573" y="622" font-size="12.5" fill="#4B5563">+ nom du fichier d'origine</text>
<text x="573" y="640" font-size="12.5" fill="#4B5563">+ date de chargement</text>
<rect x="795" y="542" width="210" height="142" rx="12" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.3" filter="url(#ombre)"/>
<path d="M807,542 h186 a12,12 0 0 1 12,12 v0 h-210 v0 a12,12 0 0 1 12,-12 z" fill="#9AA3AD"/>
<rect x="795" y="552" width="210" height="4" fill="#9AA3AD"/>
<text x="813" y="580" font-size="15" font-weight="700" fill="#1F2933">STAGING</text>
<rect x="925" y="565" width="68" height="20" rx="10" fill="#7B8794"/>
<text x="959.0" y="579" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">argent</text>
<text x="813" y="604" font-size="12.5" fill="#4B5563">Colonnes renommées</text>
<text x="813" y="622" font-size="12.5" fill="#4B5563">et typées (vues)</text>
<rect x="1035" y="542" width="210" height="142" rx="12" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.3" filter="url(#ombre)"/>
<path d="M1047,542 h186 a12,12 0 0 1 12,12 v0 h-210 v0 a12,12 0 0 1 12,-12 z" fill="#9AA3AD"/>
<rect x="1035" y="552" width="210" height="4" fill="#9AA3AD"/>
<text x="1053" y="580" font-size="15" font-weight="700" fill="#1F2933">INTERMEDIATE</text>
<text x="1053" y="604" font-size="12.5" fill="#4B5563">Trajets valides ou rejetés,</text>
<text x="1053" y="622" font-size="12.5" fill="#4B5563">puis trajets valides</text>
<text x="1053" y="640" font-size="12.5" fill="#4B5563">enrichis</text>
<rect x="1275" y="542" width="210" height="142" rx="12" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.3" filter="url(#ombre)"/>
<path d="M1287,542 h186 a12,12 0 0 1 12,12 v0 h-210 v0 a12,12 0 0 1 12,-12 z" fill="#E0B100"/>
<rect x="1275" y="552" width="210" height="4" fill="#E0B100"/>
<text x="1293" y="580" font-size="15" font-weight="700" fill="#1F2933">MARTS</text>
<rect x="1441" y="565" width="32" height="20" rx="10" fill="#B58900"/>
<text x="1457.0" y="579" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">or</text>
<text x="1293" y="604" font-size="12.5" fill="#4B5563">Table de faits des trajets</text>
<text x="1293" y="622" font-size="12.5" fill="#4B5563">5 dimensions</text>
<text x="1293" y="640" font-size="12.5" fill="#4B5563">3 tables d'analyse</text>
<line x1="528" y1="613.0" x2="551" y2="613.0" stroke="#6B7280" stroke-width="1.8" marker-end="url(#fleche)"/>
<line x1="768" y1="613.0" x2="791" y2="613.0" stroke="#6B7280" stroke-width="1.8" marker-end="url(#fleche)"/>
<line x1="1008" y1="613.0" x2="1031" y2="613.0" stroke="#6B7280" stroke-width="1.8" marker-end="url(#fleche)"/>
<line x1="1248" y1="613.0" x2="1271" y2="613.0" stroke="#6B7280" stroke-width="1.8" marker-end="url(#fleche)"/>
<rect x="795" y="811" width="690" height="88" rx="12" fill="#FFFFFF" stroke="#9AD3A8" stroke-width="1.3" filter="url(#ombre)"/>
<text x="813" y="841" font-size="15" font-weight="700" fill="#1F2933">La réponse à la direction</text>
<text x="813" y="865" font-size="12.5" fill="#4B5563">Une requête SQL : où et quand la demande est-elle la plus forte,</text>
<text x="813" y="883" font-size="12.5" fill="#4B5563">et combien rapporte un trajet ?</text>
