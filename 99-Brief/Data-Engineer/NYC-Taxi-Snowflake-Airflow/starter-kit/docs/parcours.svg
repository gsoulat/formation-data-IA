<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1644 687" width="1644" height="687" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
  </marker>
  <filter id="ombre" x="-5%" y="-5%" width="110%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1644" height="687" fill="#FFFFFF"/>
<text x="822.0" y="44" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">Le parcours en cinq journées</text>
<text x="822.0" y="70" font-size="14" fill="#4B5563" text-anchor="middle">Pipeline médaillon NYC Yellow Taxi : Snowflake et Airflow</text>
<rect x="40" y="96" width="292" height="533" rx="16" fill="#FFFFFF" stroke="#7FD0EE" stroke-width="1.5" filter="url(#ombre)"/>
<path d="M40,112 a16,16 0 0 1 16,-16 h260 a16,16 0 0 1 16,16 v88 h-292 z" fill="#127CA6"/>
<text x="60" y="130" font-size="19" font-weight="700" fill="#FFFFFF">Jour 1</text>
<rect x="217" y="113" width="99" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="266.5" y="130" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Snowflake</text>
<text x="60" y="158" font-size="15" font-weight="600" fill="#FFFFFF">Comprendre le pipeline</text>
<text x="60" y="178" font-size="15" font-weight="600" fill="#FFFFFF">et créer l'entrepôt</text>
<circle cx="70" cy="225" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="70" y="229.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">1</text>
<text x="90" y="230" font-size="13" fill="#1F2933">Lire le schéma du pipeline fourni</text>
<circle cx="70" cy="254" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="70" y="258.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">2</text>
<text x="90" y="259" font-size="13" fill="#1F2933">Explorer le fichier de janvier</text>
<text x="90" y="276" font-size="13" fill="#1F2933">et remplir la fiche source</text>
<circle cx="70" cy="300" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="70" y="304.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">3</text>
<text x="90" y="305" font-size="13" fill="#1F2933">Suivre le guide sur les rôles</text>
<text x="90" y="322" font-size="13" fill="#1F2933">et les droits</text>
<circle cx="70" cy="346" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="70" y="350.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">4</text>
<text x="90" y="351" font-size="13" fill="#1F2933">Écrire le script SQL qui crée</text>
<text x="90" y="368" font-size="13" fill="#1F2933">l'entrepôt</text>
<circle cx="70" cy="392" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="70" y="396.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">5</text>
<text x="90" y="397" font-size="13" fill="#1F2933">Générer la paire de clés</text>
<text x="90" y="414" font-size="13" fill="#1F2933">et tester la connexion</text>
<path d="M40,555 h292 v58 a16,16 0 0 1 -16,16 h-260 a16,16 0 0 1 -16,-16 z" fill="#EDF9FE"/>
<line x1="40" y1="555" x2="332" y2="555" stroke="#7FD0EE" stroke-width="1"/>
<text x="60" y="577" font-size="11" font-weight="700" fill="#127CA6" letter-spacing="0.6">RÉSULTAT À OBTENIR</text>
<text x="60" y="597" font-size="13.5" font-weight="600" fill="#1F2933">L'utilisateur de service</text>
<text x="60" y="614" font-size="13.5" font-weight="600" fill="#1F2933">se connecte avec sa clé</text>
<line x1="335" y1="148.0" x2="355" y2="148.0" stroke="#6B7280" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="358" y="96" width="292" height="533" rx="16" fill="#FFFFFF" stroke="#7FD0EE" stroke-width="1.5" filter="url(#ombre)"/>
<path d="M358,112 a16,16 0 0 1 16,-16 h260 a16,16 0 0 1 16,16 v88 h-292 z" fill="#127CA6"/>
<text x="378" y="130" font-size="19" font-weight="700" fill="#FFFFFF">Jour 2</text>
<rect x="535" y="113" width="99" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="584.5" y="130" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Snowflake</text>
<text x="378" y="158" font-size="15" font-weight="600" fill="#FFFFFF">Charger les fichiers</text>
<text x="378" y="178" font-size="15" font-weight="600" fill="#FFFFFF">dans la couche RAW</text>
<circle cx="388" cy="225" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="388" y="229.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">1</text>
<text x="408" y="230" font-size="13" fill="#1F2933">Lire le contrat de la couche RAW</text>
<circle cx="388" cy="254" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="388" y="258.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">2</text>
<text x="408" y="259" font-size="13" fill="#1F2933">Suivre le guide de chargement</text>
<circle cx="388" cy="283" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="388" y="287.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">3</text>
<text x="408" y="288" font-size="13" fill="#1F2933">Créer les formats de fichier,</text>
<text x="408" y="305" font-size="13" fill="#1F2933">le stage et les deux tables</text>
<circle cx="388" cy="329" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="388" y="333.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">4</text>
<text x="408" y="334" font-size="13" fill="#1F2933">Charger janvier :</text>
<text x="408" y="351" font-size="13" fill="#1F2933">PUT puis COPY INTO</text>
<circle cx="388" cy="375" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="388" y="379.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">5</text>
<text x="408" y="380" font-size="13" fill="#1F2933">Relancer le chargement :</text>
<text x="408" y="397" font-size="13" fill="#1F2933">aucun doublon</text>
<circle cx="388" cy="421" r="11" fill="#EDF9FE" stroke="#7FD0EE" stroke-width="1.2"/>
<text x="388" y="425.5" font-size="12" font-weight="700" fill="#127CA6" text-anchor="middle">6</text>
<text x="408" y="426" font-size="13" fill="#1F2933">Écrire le script Python par mois,</text>
<text x="408" y="443" font-size="13" fill="#1F2933">puis charger les 265 zones</text>
<path d="M358,555 h292 v58 a16,16 0 0 1 -16,16 h-260 a16,16 0 0 1 -16,-16 z" fill="#EDF9FE"/>
<line x1="358" y1="555" x2="650" y2="555" stroke="#7FD0EE" stroke-width="1"/>
<text x="378" y="577" font-size="11" font-weight="700" fill="#127CA6" letter-spacing="0.6">RÉSULTAT À OBTENIR</text>
<text x="378" y="597" font-size="13.5" font-weight="600" fill="#1F2933">3,47 millions de lignes</text>
<text x="378" y="614" font-size="13.5" font-weight="600" fill="#1F2933">pour janvier, 265 zones</text>
<line x1="653" y1="148.0" x2="673" y2="148.0" stroke="#6B7280" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="676" y="96" width="292" height="533" rx="16" fill="#FFFFFF" stroke="#8DB8E0" stroke-width="1.5" filter="url(#ombre)"/>
<path d="M676,112 a16,16 0 0 1 16,-16 h260 a16,16 0 0 1 16,16 v88 h-292 z" fill="#1F6FB2"/>
<text x="696" y="130" font-size="19" font-weight="700" fill="#FFFFFF">Jour 3</text>
<rect x="871" y="113" width="81" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="911.5" y="130" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Airflow</text>
<text x="696" y="158" font-size="15" font-weight="600" fill="#FFFFFF">Premier pipeline Airflow :</text>
<text x="696" y="178" font-size="15" font-weight="600" fill="#FFFFFF">automatiser le chargement</text>
<circle cx="706" cy="225" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="706" y="229.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">1</text>
<text x="726" y="230" font-size="13" fill="#1F2933">Suivre le guide Airflow 3</text>
<text x="726" y="247" font-size="13" fill="#1F2933">(sections 1 à 5)</text>
<circle cx="706" cy="271" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="706" y="275.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">2</text>
<text x="726" y="276" font-size="13" fill="#1F2933">Créer et démarrer</text>
<text x="726" y="293" font-size="13" fill="#1F2933">le projet Astro</text>
<circle cx="706" cy="317" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="706" y="321.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">3</text>
<text x="726" y="322" font-size="13" fill="#1F2933">Connecter Airflow à Snowflake</text>
<text x="726" y="339" font-size="13" fill="#1F2933">et le prouver par un mini DAG</text>
<circle cx="706" cy="363" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="706" y="367.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">4</text>
<text x="726" y="368" font-size="13" fill="#1F2933">Écrire le DAG de chargement</text>
<circle cx="706" cy="392" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="706" y="396.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">5</text>
<text x="726" y="397" font-size="13" fill="#1F2933">Déduire le nom du fichier</text>
<text x="726" y="414" font-size="13" fill="#1F2933">du mois traité par l'exécution</text>
<circle cx="706" cy="438" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="706" y="442.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">6</text>
<text x="726" y="443" font-size="13" fill="#1F2933">Activer le DAG : janvier,</text>
<text x="726" y="460" font-size="13" fill="#1F2933">février et mars sont rejoués</text>
<path d="M676,555 h292 v58 a16,16 0 0 1 -16,16 h-260 a16,16 0 0 1 -16,-16 z" fill="#EFF6FD"/>
<line x1="676" y1="555" x2="968" y2="555" stroke="#8DB8E0" stroke-width="1"/>
<text x="696" y="577" font-size="11" font-weight="700" fill="#1F6FB2" letter-spacing="0.6">RÉSULTAT À OBTENIR</text>
<text x="696" y="597" font-size="13.5" font-weight="600" fill="#1F2933">3 exécutions réussies</text>
<line x1="971" y1="148.0" x2="991" y2="148.0" stroke="#6B7280" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="994" y="96" width="292" height="533" rx="16" fill="#FFFFFF" stroke="#8DB8E0" stroke-width="1.5" filter="url(#ombre)"/>
<path d="M994,112 a16,16 0 0 1 16,-16 h260 a16,16 0 0 1 16,16 v88 h-292 z" fill="#1F6FB2"/>
<text x="1014" y="130" font-size="19" font-weight="700" fill="#FFFFFF">Jour 4</text>
<rect x="1189" y="113" width="81" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="1229.5" y="130" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Airflow</text>
<text x="1014" y="158" font-size="15" font-weight="600" fill="#FFFFFF">Transformer et contrôler</text>
<text x="1014" y="178" font-size="15" font-weight="600" fill="#FFFFFF">les données avec Airflow</text>
<circle cx="1024" cy="225" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="1024" y="229.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">1</text>
<text x="1044" y="230" font-size="13" fill="#1F2933">Suivre le guide Airflow 3</text>
<text x="1044" y="247" font-size="13" fill="#1F2933">(section 6)</text>
<circle cx="1024" cy="271" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="1024" y="275.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">2</text>
<text x="1044" y="276" font-size="13" fill="#1F2933">Lire les fichiers SQL fournis</text>
<circle cx="1024" cy="300" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="1024" y="304.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">3</text>
<text x="1044" y="305" font-size="13" fill="#1F2933">Trouver l'ordre d'exécution</text>
<text x="1044" y="322" font-size="13" fill="#1F2933">et l'ajouter au DAG</text>
<circle cx="1024" cy="346" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="1024" y="350.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">4</text>
<text x="1044" y="351" font-size="13" fill="#1F2933">Brancher le contrôle fourni,</text>
<text x="1044" y="368" font-size="13" fill="#1F2933">en écrire deux autres</text>
<circle cx="1024" cy="392" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="1024" y="396.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">5</text>
<text x="1044" y="397" font-size="13" fill="#1F2933">Faire échouer un contrôle exprès</text>
<circle cx="1024" cy="421" r="11" fill="#EFF6FD" stroke="#8DB8E0" stroke-width="1.2"/>
<text x="1024" y="425.5" font-size="12" font-weight="700" fill="#1F6FB2" text-anchor="middle">6</text>
<text x="1044" y="426" font-size="13" fill="#1F2933">Relancer février :</text>
<text x="1044" y="443" font-size="13" fill="#1F2933">volumes identiques</text>
<path d="M994,555 h292 v58 a16,16 0 0 1 -16,16 h-260 a16,16 0 0 1 -16,-16 z" fill="#EFF6FD"/>
<line x1="994" y1="555" x2="1286" y2="555" stroke="#8DB8E0" stroke-width="1"/>
<text x="1014" y="577" font-size="11" font-weight="700" fill="#1F6FB2" letter-spacing="0.6">RÉSULTAT À OBTENIR</text>
<text x="1014" y="597" font-size="13.5" font-weight="600" fill="#1F2933">10 382 378 trajets valides</text>
<text x="1014" y="614" font-size="13.5" font-weight="600" fill="#1F2933">dans FCT_TRIPS</text>
<line x1="1289" y1="148.0" x2="1309" y2="148.0" stroke="#6B7280" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="1312" y="96" width="292" height="533" rx="16" fill="#FFFFFF" stroke="#9AD3A8" stroke-width="1.5" filter="url(#ombre)"/>
<path d="M1312,112 a16,16 0 0 1 16,-16 h260 a16,16 0 0 1 16,16 v88 h-292 z" fill="#1E7A3A"/>
<text x="1332" y="130" font-size="19" font-weight="700" fill="#FFFFFF">Jour 5</text>
<rect x="1525" y="113" width="63" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="1556.5" y="130" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bilan</text>
<text x="1332" y="158" font-size="15" font-weight="600" fill="#FFFFFF">Contrôler, documenter</text>
<text x="1332" y="178" font-size="15" font-weight="600" fill="#FFFFFF">et présenter</text>
<circle cx="1342" cy="225" r="11" fill="#F0FAF2" stroke="#9AD3A8" stroke-width="1.2"/>
<text x="1342" y="229.5" font-size="12" font-weight="700" fill="#1E7A3A" text-anchor="middle">1</text>
<text x="1362" y="230" font-size="13" fill="#1F2933">Écrire la requête qui répond</text>
<text x="1362" y="247" font-size="13" fill="#1F2933">à la direction</text>
<circle cx="1342" cy="271" r="11" fill="#F0FAF2" stroke="#9AD3A8" stroke-width="1.2"/>
<text x="1342" y="275.5" font-size="12" font-weight="700" fill="#1E7A3A" text-anchor="middle">2</text>
<text x="1362" y="276" font-size="13" fill="#1F2933">Compter les trajets anormaux</text>
<text x="1362" y="293" font-size="13" fill="#1F2933">et comparer au rapport qualité</text>
<circle cx="1342" cy="317" r="11" fill="#F0FAF2" stroke="#9AD3A8" stroke-width="1.2"/>
<text x="1342" y="321.5" font-size="12" font-weight="700" fill="#1E7A3A" text-anchor="middle">3</text>
<text x="1362" y="322" font-size="13" fill="#1F2933">Mesurer les crédits consommés</text>
<circle cx="1342" cy="346" r="11" fill="#F0FAF2" stroke="#9AD3A8" stroke-width="1.2"/>
<text x="1342" y="350.5" font-size="12" font-weight="700" fill="#1E7A3A" text-anchor="middle">4</text>
<text x="1362" y="351" font-size="13" fill="#1F2933">Vérifier les droits du rôle</text>
<circle cx="1342" cy="375" r="11" fill="#F0FAF2" stroke="#9AD3A8" stroke-width="1.2"/>
<text x="1342" y="379.5" font-size="12" font-weight="700" fill="#1E7A3A" text-anchor="middle">5</text>
<text x="1362" y="380" font-size="13" fill="#1F2933">Finir le README, les captures</text>
<text x="1362" y="397" font-size="13" fill="#1F2933">et présenter la démonstration</text>
<line x1="1332" y1="483" x2="1584" y2="483" stroke="#9AD3A8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="1332" y="503" font-size="12.5" font-style="italic" fill="#4B5563">Bonus 1 : notification Discord</text>
<text x="1332" y="523" font-size="12.5" font-style="italic" fill="#4B5563">Bonus 2 : déploiement sur Astro</text>
<path d="M1312,555 h292 v58 a16,16 0 0 1 -16,16 h-260 a16,16 0 0 1 -16,-16 z" fill="#F0FAF2"/>
<line x1="1312" y1="555" x2="1604" y2="555" stroke="#9AD3A8" stroke-width="1"/>
<text x="1332" y="577" font-size="11" font-weight="700" fill="#1E7A3A" letter-spacing="0.6">RÉSULTAT À OBTENIR</text>
<text x="1332" y="597" font-size="13.5" font-weight="600" fill="#1F2933">Démonstration de 15 minutes</text>
<rect x="40" y="651" width="16" height="16" rx="4" fill="#127CA6"/>
<text x="64" y="664" font-size="12.5" fill="#4B5563">Journées Snowflake : l'entrepôt et le chargement</text>
<rect x="449.6" y="651" width="16" height="16" rx="4" fill="#1F6FB2"/>
<text x="473.6" y="664" font-size="12.5" fill="#4B5563">Journées Airflow : l'automatisation</text>
<rect x="765.6" y="651" width="16" height="16" rx="4" fill="#1E7A3A"/>
<text x="789.6" y="664" font-size="12.5" fill="#4B5563">Bilan et démonstration</text>
</svg>